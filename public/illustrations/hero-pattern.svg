<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" fill="none" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="heroGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0d9488" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="heroGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background glow -->
  <circle cx="300" cy="200" r="180" fill="url(#heroGlow)"/>

  <!-- Orbiting circles -->
  <circle cx="300" cy="200" r="140" stroke="rgba(255,255,255,0.08)" stroke-width="1" fill="none" stroke-dasharray="2 6"/>
  <circle cx="300" cy="200" r="100" stroke="rgba(255,255,255,0.12)" stroke-width="1" fill="none"/>
  <circle cx="300" cy="200" r="60" stroke="rgba(255,255,255,0.2)" stroke-width="1" fill="none"/>

  <!-- Central cross -->
  <g transform="translate(300, 200)">
    <circle cx="0" cy="0" r="40" fill="rgba(13, 148, 136, 0.2)"/>
    <rect x="-4" y="-18" width="8" height="36" rx="2" fill="rgba(255,255,255,0.9)"/>
    <rect x="-18" y="-4" width="36" height="8" rx="2" fill="rgba(255,255,255,0.9)"/>
  </g>

  <!-- Floating dots on orbits -->
  <circle cx="400" cy="200" r="4" fill="#2dd4bf" opacity="0.8"/>
  <circle cx="240" cy="260" r="3" fill="#f59e0b" opacity="0.7"/>
  <circle cx="180" cy="140" r="3" fill="white" opacity="0.6"/>
  <circle cx="380" cy="100" r="4" fill="#2dd4bf" opacity="0.5"/>
  <circle cx="420" cy="280" r="3" fill="white" opacity="0.5"/>
</svg>
