<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0fdfa"/>
      <stop offset="100%" stop-color="#ccfbf1"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="300" rx="16" fill="url(#bgGrad)"/>

  <!-- Grid lines -->
  <line x1="40" y1="240" x2="360" y2="240" stroke="#0B1D3A" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="40" y1="240" x2="40" y2="60" stroke="#0B1D3A" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Dotted grid -->
  <line x1="40" y1="200" x2="360" y2="200" stroke="#0B1D3A" stroke-width="0.5" stroke-dasharray="3 3" opacity="0.2"/>
  <line x1="40" y1="160" x2="360" y2="160" stroke="#0B1D3A" stroke-width="0.5" stroke-dasharray="3 3" opacity="0.2"/>
  <line x1="40" y1="120" x2="360" y2="120" stroke="#0B1D3A" stroke-width="0.5" stroke-dasharray="3 3" opacity="0.2"/>
  <line x1="40" y1="80" x2="360" y2="80" stroke="#0B1D3A" stroke-width="0.5" stroke-dasharray="3 3" opacity="0.2"/>

  <!-- Bars representing growth -->
  <rect x="70" y="190" width="30" height="50" rx="3" fill="url(#barGrad)" opacity="0.7"/>
  <rect x="115" y="165" width="30" height="75" rx="3" fill="url(#barGrad)" opacity="0.8"/>
  <rect x="160" y="135" width="30" height="105" rx="3" fill="url(#barGrad)" opacity="0.85"/>
  <rect x="205" y="105" width="30" height="135" rx="3" fill="url(#barGrad)" opacity="0.9"/>
  <rect x="250" y="85" width="30" height="155" rx="3" fill="url(#barGrad)"/>
  <rect x="295" y="65" width="30" height="175" rx="3" fill="url(#barGrad)"/>

  <!-- Trend line -->
  <path d="M 85 195 Q 130 175 175 140 T 265 90 T 310 70" stroke="#0B1D3A" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- Dots on trend line -->
  <circle cx="85" cy="195" r="4" fill="white" stroke="#0B1D3A" stroke-width="2"/>
  <circle cx="310" cy="70" r="5" fill="#0B1D3A"/>

  <!-- Upward arrow -->
  <g transform="translate(330, 50)">
    <circle cx="0" cy="0" r="14" fill="#0d9488"/>
    <path d="M -5 2 L 0 -4 L 5 2" stroke="white" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="0" y1="-4" x2="0" y2="4" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Medical cross accent -->
  <g transform="translate(55, 260) scale(0.5)">
    <rect x="-4" y="-10" width="8" height="20" rx="1" fill="#0d9488" opacity="0.3"/>
    <rect x="-10" y="-4" width="20" height="8" rx="1" fill="#0d9488" opacity="0.3"/>
  </g>
</svg>
