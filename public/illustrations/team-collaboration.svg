<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <defs>
    <linearGradient id="teamBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0fdfa"/>
      <stop offset="100%" stop-color="#FAFAF5"/>
    </linearGradient>
  </defs>

  <rect width="400" height="300" rx="16" fill="url(#teamBg)"/>

  <!-- Connection lines between people -->
  <path d="M 120 150 Q 200 120 280 150" stroke="#0d9488" stroke-width="1.5" stroke-dasharray="4 4" fill="none" opacity="0.5"/>
  <path d="M 120 150 Q 200 200 280 150" stroke="#0d9488" stroke-width="1.5" stroke-dasharray="4 4" fill="none" opacity="0.5"/>

  <!-- Person 1 (left) -->
  <g transform="translate(120, 150)">
    <circle cx="0" cy="0" r="35" fill="#0B1D3A"/>
    <circle cx="0" cy="-8" r="10" fill="white"/>
    <path d="M -14 12 Q -14 2 0 2 Q 14 2 14 12 L 14 18 L -14 18 Z" fill="white"/>
  </g>

  <!-- Person 2 (center - slightly larger for emphasis) -->
  <g transform="translate(200, 130)">
    <circle cx="0" cy="0" r="40" fill="#0d9488"/>
    <circle cx="0" cy="-10" r="12" fill="white"/>
    <path d="M -16 14 Q -16 2 0 2 Q 16 2 16 14 L 16 20 L -16 20 Z" fill="white"/>
    <!-- Badge -->
    <g transform="translate(22, -22)">
      <circle cx="0" cy="0" r="10" fill="#f59e0b"/>
      <path d="M -3 0 L -1 2 L 3 -2" stroke="white" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- Person 3 (right) -->
  <g transform="translate(280, 150)">
    <circle cx="0" cy="0" r="35" fill="#0B1D3A"/>
    <circle cx="0" cy="-8" r="10" fill="white"/>
    <path d="M -14 12 Q -14 2 0 2 Q 14 2 14 12 L 14 18 L -14 18 Z" fill="white"/>
  </g>

  <!-- Document/clipboard accent below -->
  <g transform="translate(200, 230)">
    <rect x="-35" y="-20" width="70" height="44" rx="4" fill="white" stroke="#0B1D3A" stroke-width="2"/>
    <rect x="-20" y="-25" width="40" height="8" rx="2" fill="#0B1D3A"/>
    <rect x="-25" y="-8" width="30" height="3" rx="0.5" fill="#0B1D3A" opacity="0.4"/>
    <rect x="-25" y="-1" width="40" height="3" rx="0.5" fill="#0B1D3A" opacity="0.4"/>
    <rect x="-25" y="6" width="20" height="3" rx="0.5" fill="#0B1D3A" opacity="0.4"/>
    <circle cx="18" cy="14" r="6" fill="#0d9488"/>
    <path d="M 15 14 L 17 16 L 21 12" stroke="white" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Decorative crosses -->
  <g transform="translate(50, 80)" opacity="0.15">
    <rect x="-4" y="-10" width="8" height="20" rx="1" fill="#0d9488"/>
    <rect x="-10" y="-4" width="20" height="8" rx="1" fill="#0d9488"/>
  </g>
  <g transform="translate(350, 260)" opacity="0.15">
    <rect x="-4" y="-10" width="8" height="20" rx="1" fill="#0d9488"/>
    <rect x="-10" y="-4" width="20" height="8" rx="1" fill="#0d9488"/>
  </g>
</svg>
