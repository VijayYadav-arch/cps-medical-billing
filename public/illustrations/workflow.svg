<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <defs>
    <linearGradient id="wfBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAFAF5"/>
      <stop offset="100%" stop-color="#f0f3f9"/>
    </linearGradient>
  </defs>

  <rect width="400" height="300" rx="16" fill="url(#wfBg)"/>

  <!-- Connection lines -->
  <path d="M 80 150 L 160 150" stroke="#0d9488" stroke-width="2" stroke-dasharray="4 4" fill="none"/>
  <path d="M 240 150 L 320 150" stroke="#0d9488" stroke-width="2" stroke-dasharray="4 4" fill="none"/>

  <!-- Node 1: Claim Submission -->
  <g transform="translate(40, 110)">
    <rect x="0" y="0" width="80" height="80" rx="12" fill="white" stroke="#0B1D3A" stroke-width="2"/>
    <rect x="18" y="20" width="44" height="6" rx="1" fill="#0B1D3A" opacity="0.8"/>
    <rect x="18" y="32" width="34" height="4" rx="1" fill="#0B1D3A" opacity="0.4"/>
    <rect x="18" y="42" width="40" height="4" rx="1" fill="#0B1D3A" opacity="0.4"/>
    <rect x="18" y="52" width="30" height="4" rx="1" fill="#0B1D3A" opacity="0.4"/>
    <circle cx="60" cy="60" r="6" fill="#0d9488"/>
    <path d="M 57 60 L 59 62 L 63 58" stroke="white" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Node 2: Processing -->
  <g transform="translate(160, 110)">
    <circle cx="40" cy="40" r="40" fill="#0B1D3A"/>
    <g transform="translate(40, 40)">
      <circle cx="0" cy="0" r="20" stroke="white" stroke-width="1.5" fill="none" opacity="0.5"/>
      <rect x="-2" y="-10" width="4" height="20" rx="0.5" fill="white"/>
      <rect x="-10" y="-2" width="20" height="4" rx="0.5" fill="white"/>
      <circle cx="0" cy="0" r="1.5" fill="#0d9488"/>
    </g>
    <!-- Rotating dots -->
    <circle cx="20" cy="40" r="2" fill="#2dd4bf"/>
    <circle cx="60" cy="40" r="2" fill="#2dd4bf"/>
    <circle cx="40" cy="20" r="2" fill="#2dd4bf"/>
    <circle cx="40" cy="60" r="2" fill="#2dd4bf"/>
  </g>

  <!-- Node 3: Payment -->
  <g transform="translate(280, 110)">
    <rect x="0" y="0" width="80" height="80" rx="12" fill="white" stroke="#0d9488" stroke-width="2"/>
    <g transform="translate(40, 40)">
      <!-- Dollar symbol -->
      <circle cx="0" cy="0" r="22" fill="#f0fdfa"/>
      <text x="0" y="7" text-anchor="middle" font-family="Georgia, serif" font-size="28" font-weight="bold" fill="#0d9488">$</text>
    </g>
  </g>

  <!-- Labels -->
  <text x="80" y="210" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#0B1D3A">SUBMIT</text>
  <text x="200" y="210" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#0B1D3A">PROCESS</text>
  <text x="320" y="210" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#0B1D3A">PAID</text>

  <!-- Decorative medical crosses -->
  <g transform="translate(40, 50)" opacity="0.1">
    <rect x="-3" y="-8" width="6" height="16" rx="1" fill="#0d9488"/>
    <rect x="-8" y="-3" width="16" height="6" rx="1" fill="#0d9488"/>
  </g>
  <g transform="translate(360, 250)" opacity="0.1">
    <rect x="-3" y="-8" width="6" height="16" rx="1" fill="#0d9488"/>
    <rect x="-8" y="-3" width="16" height="6" rx="1" fill="#0d9488"/>
  </g>
</svg>
