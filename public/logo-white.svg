<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 72" fill="none">
  <!-- Icon: rounded square with monogram (white on transparent) -->
  <g>
    <!-- Background shape - subtle white outline -->
    <rect x="4" y="4" width="64" height="64" rx="14" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.25)" stroke-width="1.5"/>

    <!-- Medical cross (white) -->
    <g transform="translate(36, 36)">
      <!-- Outer ring -->
      <circle cx="0" cy="0" r="18" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" fill="none"/>

      <!-- Cross -->
      <rect x="-3" y="-11" width="6" height="22" rx="1.5" fill="white"/>
      <rect x="-11" y="-3" width="22" height="6" rx="1.5" fill="white"/>

      <!-- Inner accent dot -->
      <circle cx="0" cy="0" r="1.5" fill="#2dd4bf"/>
    </g>

    <!-- Small upward chevron accent -->
    <path d="M 52 58 L 56 54 L 60 58" stroke="rgba(255,255,255,0.7)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- Wordmark in white -->
  <g transform="translate(84, 0)">
    <text x="0" y="40" font-family="Georgia, 'DM Serif Display', serif" font-size="32" font-weight="400" fill="white" letter-spacing="-0.5">CPS</text>
    <rect x="0" y="46" width="28" height="2" rx="1" fill="#2dd4bf"/>
    <text x="0" y="62" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="9" font-weight="600" fill="rgba(255,255,255,0.7)" letter-spacing="2.5">MEDICAL BILLING</text>
  </g>
</svg>
