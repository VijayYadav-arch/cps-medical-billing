<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 72" fill="none">
  <defs>
    <linearGradient id="cpsGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1D3A"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
  </defs>

  <!-- Icon: rounded square with monogram -->
  <g>
    <!-- Background shape -->
    <rect x="4" y="4" width="64" height="64" rx="14" fill="url(#cpsGradient)"/>

    <!-- Decorative corner accent -->
    <path d="M 4 18 Q 4 4 18 4 L 24 4 L 24 8 L 18 8 Q 8 8 8 18 L 8 24 L 4 24 Z" fill="rgba(255,255,255,0.1)"/>

    <!-- Medical cross (white) -->
    <g transform="translate(36, 36)">
      <!-- Outer ring -->
      <circle cx="0" cy="0" r="18" stroke="rgba(255,255,255,0.15)" stroke-width="1.5" fill="none"/>

      <!-- Cross -->
      <rect x="-3" y="-11" width="6" height="22" rx="1.5" fill="white"/>
      <rect x="-11" y="-3" width="22" height="6" rx="1.5" fill="white"/>

      <!-- Inner accent dot -->
      <circle cx="0" cy="0" r="1.5" fill="#0d9488"/>
    </g>

    <!-- Small upward chevron accent (growth indicator) -->
    <path d="M 52 58 L 56 54 L 60 58" stroke="rgba(255,255,255,0.6)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- Wordmark -->
  <g transform="translate(84, 0)">
    <!-- CPS in serif font -->
    <text x="0" y="40" font-family="Georgia, 'DM Serif Display', serif" font-size="32" font-weight="400" fill="#0B1D3A" letter-spacing="-0.5">CPS</text>

    <!-- Teal accent line -->
    <rect x="0" y="46" width="28" height="2" rx="1" fill="#0d9488"/>

    <!-- Tagline -->
    <text x="0" y="62" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="9" font-weight="600" fill="#64748b" letter-spacing="2.5">MEDICAL BILLING</text>
  </g>
</svg>
